<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery | CodeAlpha Task 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <h1>Image Gallery</h1>
        <p>CodeAlpha Frontend Development – Task 1</p>
    </header>

    <main class="container">

        <div class="controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="city">City</button>
            <button class="filter-btn" data-filter="travel">Travel</button>
        </div>

        <section class="gallery" id="gallery">

            <!-- Nature Images -->
            <figure class="card" data-category="nature">
                <img src="nature1.svg" alt="Mountain landscape">
                <figcaption>Mountain Escape</figcaption>
            </figure>

            <figure class="card" data-category="nature">
                <img src="nature2.svg" alt="Forest landscape">
                <figcaption>Green Forest</figcaption>
            </figure>

            <!-- City Images -->
            <figure class="card" data-category="city">
                <img src="city1.svg" alt="City skyline">
                <figcaption>City Lights</figcaption>
            </figure>

            <figure class="card" data-category="city">
                <img src="city2.svg" alt="Modern city">
                <figcaption>Modern City</figcaption>
            </figure>

            <!-- Travel Images -->
            <figure class="card" data-category="travel">
                <img src="travel1.svg" alt="Travel destination">
                <figcaption>Travel Adventure</figcaption>
            </figure>

            <figure class="card" data-category="travel">
                <img src="travel2.svg" alt="Beautiful travel destination">
                <figcaption>Explore The World</figcaption>
            </figure>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
